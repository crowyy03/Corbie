name: Supabase

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docs/03_TECH_ARCHITECTURE.md"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "server/**"
      - "docs/03_TECH_ARCHITECTURE.md"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy to push migrations and functions to the production project
        required: true
        type: string

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: server

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.0"

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check every function entry
        run: deno check supabase/functions/*/index.ts

      - name: Test
        run: deno test -A

  deploy:
    name: Deploy to production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'deploy'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Stop when the deploy secrets are not configured
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: |
          echo "::error::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set, nothing was deployed. Add them or deploy by hand as server/DEPLOY.md describes."
          exit 1

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"

      - name: Deploy functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --import-map supabase/functions/deno.json
