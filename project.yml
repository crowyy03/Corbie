name: Corbie

options:
  bundleIdPrefix: app.corbie
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  minimumXcodeGenVersion: "2.38"

fileGroups:
  - project.yml
  - README.md
  - Products.storekit

packages:
  CorbieCore:
    path: Packages/CorbieCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"

targets:
  Corbie:
    type: application
    platform: iOS
    sources:
      - path: Corbie
    dependencies:
      - package: CorbieCore
        product: CorbieCore
      - target: CorbieWidgets
      - target: CorbieShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corbie
        PRODUCT_NAME: Corbie
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Configs/Corbie.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Configs/Corbie-Info.plist
      properties:
        CFBundleDisplayName: Corbie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.corbie
            CFBundleURLSchemes:
              - corbie
        NSCalendarsFullAccessUsageDescription: Corbie reads and writes the events you two keep in a shared calendar.
        NSCalendarsWriteOnlyAccessUsageDescription: Add an event from Corbie to your iPhone calendar.
        NSPhotoLibraryUsageDescription: Pick a photo for a wish, a plan or a list.

  CorbieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CorbieWidgets
      - path: Corbie/Resources/Localizable.xcstrings
    dependencies:
      - package: CorbieCore
        product: CorbieCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corbie.widgets
        PRODUCT_NAME: CorbieWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Configs/CorbieWidgets.entitlements
    info:
      path: Configs/CorbieWidgets-Info.plist
      properties:
        CFBundleDisplayName: Corbie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  CorbieShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CorbieShare
      - path: Corbie/Resources/Localizable.xcstrings
    dependencies:
      - package: CorbieCore
        product: CorbieCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corbie.share
        PRODUCT_NAME: CorbieShare
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Configs/CorbieShare.entitlements
    info:
      path: Configs/CorbieShare-Info.plist
      properties:
        CFBundleDisplayName: Corbie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  CorbieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CorbieTests
    dependencies:
      - target: Corbie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corbie.tests
        GENERATE_INFOPLIST_FILE: "YES"

  CorbieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CorbieUITests
      - path: Corbie/Resources/Localizable.xcstrings
    dependencies:
      - target: Corbie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corbie.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Corbie

schemes:
  Corbie:
    build:
      parallelizeBuild: true
      targets:
        Corbie: all
        CorbieWidgets: all
        CorbieShare: all
        CorbieTests: [test]
        CorbieUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CorbieTests
        - CorbieUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CorbieWidgets:
    build:
      targets:
        CorbieWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CorbieShare:
    build:
      targets:
        CorbieShare: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
