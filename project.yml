name: Corbie

options:
  bundleIdPrefix: app.corbie
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.2"
  developmentLanguage: en
  groupSortPosition: top
  minimumXcodeGenVersion: "2.38"

fileGroups:
  - project.yml
  - README.md
  - Products.storekit

packages:
  CorbieCore:
    path: Packages/CorbieCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 735XXP9B5R
    CORBIE_SERVER_URL: "powtuiqqagdoiuqjeebr"
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
  configs:
    Debug:
      CORBIE_CLOUDKIT_ENVIRONMENT: Development
    Release:
      CORBIE_CLOUDKIT_ENVIRONMENT: Production

targets:
  Corbie:
    type: application
    platform: iOS
    sources:
      - path: Corbie
    dependencies:
      - package: CorbieCore
        product: CorbieCore
      - target: CorbieWidgets
      - target: CorbieShare
    preBuildScripts:
      - name: Check colors
        script: "\"$PROJECT_DIR/scripts/check_colors.sh\""
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Copy demo assets in Debug
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          target="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/DemoAssets"
          rm -rf "$target"
          for file in "$PROJECT_DIR"/DemoAssets/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            [ "$name" = "README.md" ] && continue
            lower="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
            case "${lower%.*}" in
              wool-coat | ceramics-class | noise-cancelling-headphones | linen-bedding-set) known_name=yes ;;
              *) known_name=no ;;
            esac
            case "${lower##*.}" in
              jpg | jpeg | png | heic) known_type=yes ;;
              *) known_type=no ;;
            esac
            if [ "$known_name" = no ] || [ "$known_type" = no ]; then
              echo "warning: DemoAssets/$name is not used, see DemoAssets/README.md for the names and types"
              continue
            fi
            mkdir -p "$target"
            cp "$file" "$target/$lower"
          done
        basedOnDependencyAnalysis: false
      - name: Check Release carries no screenshot mode
        script: |
          [ "$CONFIGURATION" = "Debug" ] && exit 0
          "$PROJECT_DIR/scripts/scan_screenshot_mode_markers.sh" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corbie
        PRODUCT_NAME: Corbie
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Configs/Corbie.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Configs/Corbie-Info.plist
      properties:
        CFBundleDisplayName: Corbie
        CORBIE_SERVER_URL: $(CORBIE_SERVER_URL)
        CorbieCloudKitEnvironment: $(CORBIE_CLOUDKIT_ENVIRONMENT)
        CORBIE_MONTHLY_PRODUCT_ID: app.corbie.monthly
        CORBIE_YEARLY_PRODUCT_ID: app.corbie.yearly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.corbie
            CFBundleURLSchemes:
              - corbie
        NSCalendarsFullAccessUsageDescription: Corbie reads and writes the events you two keep in a shared calendar.
        NSCalendarsWriteOnlyAccessUsageDescription: Add an event from Corbie to your iPhone calendar.
        NSPhotoLibraryUsageDescription: Pick a photo for a wish, a plan or a list.

  CorbieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CorbieWidgets
      - path: Corbie/Resources/Localizable.xcstrings
    dependencies:
      - package: CorbieCore
        product: CorbieCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corbie.widgets
        PRODUCT_NAME: CorbieWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Configs/CorbieWidgets.entitlements
    info:
      path: Configs/CorbieWidgets-Info.plist
      properties:
        CFBundleDisplayName: Corbie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  CorbieShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CorbieShare
      - path: Corbie/Resources/Localizable.xcstrings
    dependencies:
      - package: CorbieCore
        product: CorbieCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corbie.share
        PRODUCT_NAME: CorbieShare
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Configs/CorbieShare.entitlements
    info:
      path: Configs/CorbieShare-Info.plist
      properties:
        CFBundleDisplayName: Corbie
        CORBIE_SERVER_URL: $(CORBIE_SERVER_URL)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  CorbieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CorbieTests
    dependencies:
      - target: Corbie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corbie.tests
        GENERATE_INFOPLIST_FILE: "YES"

  CorbieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CorbieUITests
      - path: Corbie/Resources/Localizable.xcstrings
    dependencies:
      - target: Corbie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.corbie.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Corbie

schemes:
  Corbie:
    build:
      parallelizeBuild: true
      targets:
        Corbie: all
        CorbieWidgets: all
        CorbieShare: all
        CorbieTests: [test]
        CorbieUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CorbieTests
        - CorbieUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CorbieWidgets:
    build:
      targets:
        CorbieWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CorbieShare:
    build:
      targets:
        CorbieShare: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
